# БАЗОВЫЕ ПРАВИЛА ДЛЯ ВСЕХ ПРОЕКТОВ
base_rules:
  - id: "status_review"
    name: "Статус тест-кейса: Review"
    description: "Тест-кейс должен быть в статусе 'Review' для прохождения анализа"
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "required_fields"
    check_type: "field_check"
    params:
      field: "status"
      operator: "equals"
      value: "Review"
      error_message: 'Статус тест-кейса отличается от "Review"'

  - id: "has_platform_tag"
    name: "Наличие тега платформы"
    description: |
      Тест-кейс должен содержать хотя бы один тег платформы:
      - M — мобильное приложение
      - D — десктоп версия
      - A — адаптивная версия
      - PWA — прогрессивное веб-приложение
      - S — проверки backend
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "tags"
    check_type: "tag_check"
    params:
      operator: "includes_any"
      value: ["M", "D", "S", "A", "PWA"]
      error_message: "Не проставлен тег платформы ('M', 'D', 'S', 'PWA' или 'A')"

  - id: "name_no_verb_start"
    name: "Название начинается не с глагола"
    description: "Название тест-кейса не должно начинаться с глагола (Проверить, Создать, Удалить и т.д.)"
    level: "warning"
    enabled: true
    is_ai_enabled: false
    category: "naming"
    check_type: "field_check"
    params:
      field: "name"
      operator: "not_matches"
      pattern: "^(Проверить|Проверка|Попытка|Тест|Убедиться|Создать|Удалить|Изменить|Обновить|Добавить|Открыть|Закрыть|Войти|Выйти|Ввести|Выбрать|Нажать|Кликнуть|Перейти)\\b"
      case_insensitive: true
      error_message: "Название тест-кейса начинается с глагола или слова 'Тест', 'Проверка', 'Попытка'"

  #- id: "parameters_usage"
  #  name: "Хотя бы один параметр используется в шагах"
  #  description: "Минимум один из объявленных параметров должен использоваться в шагах тест-кейса (в формате {{paramName}}), чтобы при запуске создавался отдельный экземпляр ТК для каждой комбинации параметров"
  #  level: "warning"
  #  enabled: true
  #  is_ai_enabled: false
  #  category: "parameters"
  #  check_type: "parameters_usage_check"
  #  params:
  #    error_message: "Ни один параметр не используется в шагах"

  - id: "test_layer"
    name: "Заполнен тестовый слой"
    description: |
      У тест-кейса должен быть указан слой:
       - E2E Tests — для сценарных тестов;
       - Integration frontend Tests;
       - Integration backend Tests.
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "required_fields"
    check_type: "field_check"
    params:
      field: "layer"
      operator: "in"
      value:
        - "E2E Tests"
        - "Integration frontend Tests"
        - "Integration backend Tests"
      error_message: "Слой должен быть одним из 'E2E Tests', 'Integration frontend Tests' или 'Integration backend Tests'"

  - id: "required_version_and_priority"
    name: "Заполнены приоритет и версия"
    description: |
      Должны присутствовать значения в полях:
      - Priority — приоритет тест-кейса
      - Version — версия тест-кейса

      Приоритет коррелирует с важностью требования или потенциальной важностью дефекта,
      версия нового тест-кейса соответствует значению поля "Исправлено в версиях" в задаче на написание тестовой документации.
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "required_fields"
    check_type: "custom_field_check"
    params:
      operator: "all_required"
      fields: ["Priority", "Version"]
      error_message: "Не заполнены поля"

  - id: "e2e_feature_story"
    name: "Структура в E2E-Тестах"
    description: "Для E2E тестов обязательны кастомные поля Feature и Story"
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "custom_fields"
    check_type: "custom_field_check"
    params:
      operator: "all_required"
      fields: ["Feature", "Story"]
      error_message: "У E2E теста не заполнены поля структуры"
    appliesTo:
      field: "layer"
      operator: "in"
      value: ["E2E Tests"]

  - id: "integration_feature_story_scenario"
    name: "Структура в интеграционных тест-кейсах"
    description: "Для Integration тестов обязательны кастомные поля Feature, Story и Scenario"
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "custom_fields"
    check_type: "custom_field_check"
    params:
      operator: "all_required"
      fields: ["Feature", "Story", "Scenario"]
      error_message: "Отсутствует значение поля"
    appliesTo:
      field: "layer"
      operator: "in"
      value: ["Integration frontend Tests", "Integration backend Tests"]

  - id: "e2e_no_scenario"
    name: "Отсутствие поля Scenario в E2E"
    description: "Для E2E тестов не должно быть кастомного поля Scenario"
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "custom_fields"
    check_type: "custom_field_check"
    params:
      field: "Scenario"
      operator: "must_not_exist"
      error_message: "У E2E тестов не должно быть поля Scenario"
    appliesTo:
      field: "layer"
      operator: "in"
      value: ["E2E Tests"]

  - id: "expected_result_not_empty"
    name: "Заполнен общий ожидаемый результат"
    description: |
      В тест-кейсе должен быть заполнен общий ожидаемый результат: он отражает итоговое состояние системы после выполнения всех шагов
      и подтверждает достижение цели проверки.
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "expected_result"
    check_type: "field_check"
    params:
      field: "expectedResult"
      operator: "not_empty"
      error_message: "Не заполнен общий ожидаемый результат"

  - id: "expected_no_if_then"
    name: "Ожидаемый результат не содержит условия"
    description: |
      Ожидаемый результат должен описывать конкретное и однозначное поведение системы, без условных выражений.
      При необходимости предусмотреть разные сценарии — создаются отдельные тест-кейсы
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "expected_result"
    check_type: "field_check"
    params:
      field: "expectedResult"
      operator: "not_matches"
      pattern: "если.*то"
      case_insensitive: true
      error_message: "Ожидаемый результат содержит условие"

  - id: "step_no_if_then"
    name: "Шаги не содержат условия"
    description: |
      Описания шагов не должны содержать условную конструкцию 'Если ... то' ('Если отображается модалка, закрыть ее').
      Условия можно вынести в параметры или разделить на разные тест-кейсы
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "steps"
    check_type: "step_check"
    params:
      field: "description"
      operator: "not_matches"
      pattern: "если.*то"
      case_insensitive: true
      error_message: "Описание шага содержит условие"

  # в AI?
  - id: "expected_no_subjective"
    name: "Объективность ожидаемого результата"
    description: |
      Ожидаемый результат должен быть конкретным и проверяемым,
      без субъективных формулировок ('корректно', 'адекватно', 'удобно', 'эффективно' и т.п.)
    level: "warning"
    enabled: true
    is_ai_enabled: false
    category: "expected_result"
    check_type: "field_check"
    params:
      field: "expectedResult"
      operator: "not_contains_any"
      value:
        - "хорошо"
        - "верно"
        - "быстро"
        - "адекватно"
        - "быть способным"
        - "легко"
        - "обеспечивать"
        - "как минимум"
        - "эффективно"
        - "своевременно"
        - "применимо"
        - "если возможно"
        - "будет определено позже"
        - "по мере необходимости"
        - "если это целесообразно"
        - "но не ограничиваясь"
        - "иметь возможность"
        - "нормально"
        - "минимизировать"
        - "максимизировать"
        - "оптимизировать"
        - "удобно"
        - "просто"
        - "часто"
        - "обычно"
        - "большой"
        - "гибкий"
        - "устойчивый"
        - "по последнему слову техники"
        - "улучшенный"
        - "результативно"
      error_message: "Ожидаемый результат содержит субъективные формулировки"

  - id: "step_no_subjective"
    name: "Объективность описания шагов"
    description: "Описание шага не должно содержать субъективные слова"
    level: "warning"
    enabled: true
    is_ai_enabled: false
    category: "steps"
    check_type: "step_check"
    params:
      field: "description"
      operator: "not_contains_any"
      value:
        - "хорошо"
        - "верно"
        - "быстро"
        - "адекватно"
        - "быть способным"
        - "легко"
        - "обеспечивать"
        - "как минимум"
        - "эффективно"
        - "своевременно"
        - "применимо"
        - "если возможно"
        - "будет определено позже"
        - "по мере необходимости"
        - "если это целесообразно"
        - "но не ограничиваясь"
        - "иметь возможность"
        - "нормально"
        - "минимизировать"
        - "максимизировать"
        - "оптимизировать"
        - "удобно"
        - "просто"
        - "часто"
        - "обычно"
        - "большой"
        - "гибкий"
        - "устойчивый"
        - "по последнему слову техники"
        - "улучшенный"
        - "результативно"
      error_message: "Описание шага содержит субъективные формулировки"

  - id: "step_starts_with_verb"
    name: "Шаги с глагола в неопределенной форме"
    description: Описание шагов должно начинаться с глагола в неопределенной форме (окончания '-ть', '-ться' или '-ти')
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "steps"
    check_type: "step_check"
    params:
      field: "description"
      operator: "matches"
      pattern: "^([А-ЯЁ][а-яё]+(ть|ться|ти))"
      error_message: 'Описание шага должно начинаться с глагола в неопределенной форме (окончания "-ть", "-ться","-ти")'

  # TODO описание
  - id: "e2e_step_doesnt_contain_mock"
    name: "Отсутствие моков в шагах E2E"
    description: "E2E-тесты не должны содержать шаги с моками "
    level: "error"
    enabled: true
    is_ai_enabled: false
    category: "steps"
    check_type: "step_check"
    params:
      field: "description"
      operator: "not_matches"
      pattern: "(мок|стаб|подмен|эмул|симул)"
      case_insensitive: true
      error_message: "Шаги сценарных тест-кейсов не должны содержать моки"
    appliesTo:
      field: "layer"
      operator: "in"
      value: ["E2E Tests"]

  # Базовые правила стайл-гайда
  - id: "styleguide_naming"
    name: "Название отражает проверку и результат"
    description: |
      Название тест-кейса описывает проверяемое поведение и синхронизируется с ожидаемым результатом — из названия должно быть понятно, что проверяется и какой итог ожидается.
      Хорошее название:
      - краткое, информативное, сформулировано через существительное или отглагольное существительное ('Отображение ошибки', 'Загрузка справочника');
      - подтверждается ожидаемым результатом

      Примеры хороших названий:
      - "Отображение ошибки при неверном формате email"
      - "Переключение темы оформления"
      - "Валидация поля Email"
      - "Загрузка информации о справочнике"
    level: "warning"
    enabled: true
    category: "naming"
    is_ai_enabled: true
    ai_prompt: |
      НАЗВАНИЕ. Правило: краткое, информативное, отражает суть проверки и подтверждает ожидаемый результат;
      Допустимо:
      - существительное или отглагольное существительное: «Отображение ошибки при...», «Переключение темы», «Валидация поля Email»
      - длинное название, если оно точно описывает проверку
      Недопустимо:
      - теги: [M], [D], [PWA] и т.п. — переносить в метаданные;
      - технический контекст: «clone», номера багов, имена веток;
      - глагол в начале названия: «Проверить...», «Убедиться...»;
    check_type: "field_check"
    params:
      field: "name"
      operator: "not_empty"

  - id: "styleguide_steps"
    name: "Шаги описывают действия"
    description: |
      Шаг тест-кейса — действие, запускающее проверяемое поведение.
      Каждый шаг начинается с глагола ('Открыть', 'Нажать', 'Ввести'), один шаг описывает одно действие;
    level: "warning"
    enabled: true
    category: "steps"
    is_ai_enabled: true
    ai_prompt: |
      ШАГИ. Правило: один шаг = одно действие, начинается с глагола в неопределённой форме («Открыть», «Нажать», «Ввести», «Отправить»).
      Допустимо:
      - обобщения, если это одно логическое действие: «Выбрать опцию», «Заполнить форму»;
      - ожидаемый результат после шага, оформленный как отдельный блок «Ожидаемый результат:»;
      - общий шаг (общий шаг) содержит несколько последовательных подшагов — это нормально, не считать нарушением атомарности;
      - промежуточные ожидаемые результаты между шагами;
      Недопустимо:
      - несколько действий в одном шаге: «Открыть форму и ввести данные»;
      - условия внутри шага: «Если есть модалка, закрыть её»;
      - проверка и действие в одной фразе: «Нажать кнопку, должна открыться форма»
    check_type: "step_check"
    params:
      operator: "not_empty"

  - id: "styleguide_expected_result"
    name: "Проверяемый и конкретный ожидаемый результат"
    description: "Ожидаемый результат должен быть объективным и проверяемым"
    level: "warning"
    enabled: true
    category: "expected_result"
    is_ai_enabled: true
    ai_prompt: |
      ОЖИДАЕМЫЙ РЕЗУЛЬТАТ. Правило: обязателен, конкретен, проверяем, описывает состояние системы — не действие.
      Допустимо:
      - конкретный и объективный результат: «Отображается ошибка 'Невалидный формат e-mail'», «Возвращается статус-код 400 Bad Request»;
      - обобщённое описание, если шаг обобщённый: шаг «Выбрать значение в селекте» → ОР «В селекте отображается выбранное значение»;
      - несколько пунктов ОР, если все они относятся к одной странице или экрану — не требовать разбивки на тест-кейсы;
      - конкретные значения (даты, суммы) для детерминированных проверок;
      - описание видимого состояния элемента: «Модальное окно скрывается», «Кнопка задизейблена», «Список обновился»;
      - наблюдаемые свойства элемента: цвет, текст, наличие иконки, статус —  даже без указания координат и размеров;
      Недопустимо:
      - расплывчатый результат: «Система работает корректно», «Данные верные»;
      - действие вместо результата: «Проверить статус», «Убедиться, что форма открылась»;
      - субъективный результат: «Отображается красиво», «Удобно».
    check_type: "field_check"
    params:
      field: "expectedResult"
      operator: "not_empty"

  - id: "styleguide_layer_boundaries"
    name: "Границы тестовых слоев"
    description: |
      Тест-кейсы на каждом тестовом слое проверяют контрактные обязательства в рамках своей зоны ответственности:
      - **Integration frontend**-тесты проверяют изолированную логику и взаимодействие ограниченного набора UI-компонентов,
      выполнение бизнес-логики на стороне интерфейса, обработку ошибок и различных входных данных,
      а также контракты взаимодействия с сервисами (вызов запросов с определенными данными, обработка ответов),
      не покрывая полный пользовательский сценарий;
      - **Integration backend**-тесты проверяют работу сервиса или набора сервисов без проверки состояния интерфейса: корректность статусов и тела ответа, обработку ошибок и валидации, бизнес-логикy,
      запись и чтение из базы (если это часть контракта),
      взаимодействие с зависимостями и устойчивость к некорректным/пограничным данным.
      - **E2E-тесты** проверяют сквозной пользовательский сценарий на полностью собранной системе, включая совместную работу фронтенда и бекенда
      и видимый для пользователя результат, без фокуса на внутренней реализации отдельных компонентов или сервисов"
    level: "warning"
    enabled: true
    category: "custom_fields"
    is_ai_enabled: true
    ai_prompt: |
      ГРАНИЦЫ СЛОЕВ.
      Integration frontend Tests. Объект проверки: одна страница, один компонент или ограниченная группа связанных компонентов интерфейса. Может проверять только факт отправки запроса.
      Проверяет:
      - поведение и состояния UI при разных данных и ошибках;
      - вызов API (но не ответ сервера);
      - локальную клиентскую логику и бизнес-правила на стороне интерфейса;
      Не проверяет:
      - полный пользовательский путь через множество экранов;
      - сквозные сценарии, работу всей системы целиком.
      Integration backend Tests. Объект проверки: один сервис или ограниченный набор сервисов и их контракт.
      Проверяет:
      - статус и тело ответа
      - серверную валидацию и обработку ошибок;
      - бизнес-логику, запись/чтение из БД, взаимодействие с зависимостями;
      Не проверяет:
      - пользовательский путь целиком;
      - поведение интерфейса;
      - комплексные пользовательские сценарии.
      E2E Tests. Объект проверки: сквозной пользовательский путь от начала до конца на полностью собранной системе.
      Проверяет:
      - единый сквозной процесс как пользовательский путь;
      - взаимодействие интерфейса и сервисов только как часть этого пути;
      Не проверяет:
      - полный перебор вариантов данных и ошибок — это уровень Integration;
      - технические детали, не связанные с пользовательским путём;
      - несколько несвязанных доменов в одном тесте.
    check_type: "field_check"
    params:
      field: "layer"
      operator: "not_empty"

  - id: "styleguide_api_tests"
    name: "Проверка API в интеграционных тестах"
    description:
      "Integration backend/frontend тест-кейсы, проверяющие API, должны содержать
      HTTP-метод, адрес, необходимые заголовки и тело запроса (если применимо), по возможности — JSON Schema, ссылку на Swagger или другой источник"
    level: "warning"
    enabled: true
    category: "steps"
    is_ai_enabled: true
    ai_prompt: |
      ТЕСТИРОВАНИЕ API (Integration backend/frontend Tests). Правило: если тест-кейс проверяет API, в шагах должны быть явно указаны HTTP-метод, путь, необходимые заголовки и тело запроса (если применимо).
      Допустимо:
      - наличие curl как описание запроса;
      - любой регистр метода: get, POST, Delete — всё считается указанным;
      - любой глагол перед методом: «Вызвать GET», «Отправить POST», «Выполнить DELETE» — метод указан.
      HTTP-метод считается указанным, если в тексте шага присутствует одно из слов: GET, POST, PUT, DELETE, PATCH — в любом месте фразы.
      Не создавай рекомендацию «нет HTTP-метода», если хотя бы одно из этих слов есть в тексте шага.
    check_type: "step_check"
    params:
      operator: "not_empty"

  - id: "styleguide_precondition"
    name: "Предусловие отражает состояние системы"
    description: |
      Предварительные условия описывают состояние системы, данных и окружения,
      которое должно быть подготовлено *до начала выполнения тест-кейса*.

      В предусловии допустимы:
      - подготовка тестовых данных (БД, стенд);
      - переход к стартовой точке как состояние ('пользователь авторизован', 'отображается форма платежа');
      - настройка окружения, учетных записей, прав доступа;
      - состояние интеграций/SDK, устройства, предварительное мокирование запросов.
    level: "warning"
    enabled: true
    category: "required_fields"
    is_ai_enabled: true
    ai_prompt: |
      ПРЕДВАРИТЕЛЬНОЕ УСЛОВИЕ. Правило: содержит только описание состояния системы и окружения на момент начала теста.
      Допустимо:
      - подготовка данных и состояний: БД, стенд, учётки, права доступа;
      - настройка окружения: создание страниц, стендов, кабинетов; изменение настроек (routingApi, виджеты и т.п.); публикация;
      - переход к стартовой точке как состояние, если он не является целью теста;
      - подмена запросов/ответов, заглушки, файлы моков;
      - пример допустимой формулировки: «Кабинет опубликован», «Создана страница в НАЗ», «В опциях кабинета добавлена настройка routingApi».
      Недопустимо:
      - ссылки на результаты других тест-кейсов или данные, созданные другими тестами;
      - пошаговые действия в императиве: «1. Авторизоваться; 2. Перейти; 3. Нажать…» — такие действия оформлять как шаги
    check_type: "field_check"
    params:
      field: "precondition"
      operator: "not_empty"

  - id: "styleguide_multi_role"
    name: "Роли в E2E-тестах"
    description: |
      E2E-сценарий проверяет один ожидаемый результат для одной роли.
      Действия другой роли необходимо вынести в предусловие, если они подготавливают состояние, или в отдельный тест-кейс
    level: "warning"
    enabled: true
    category: "steps"
    is_ai_enabled: true
    ai_prompt: |
      РОЛИ В E2E TESTS. Правило применяется ТОЛЬКО если в тест-кейсе явно участвуют несколько ролей (например, провайдер и клиент). Если роль одна или не указана — правило не применяется, не требовать уточнения роли.
      При нескольких ролях:
      - один тест-кейс = одна роль + один итоговый ожидаемый результат;
      - если смена роли даёт другой результат или другую проверку → разделить на два тест-кейса; состояние от второй роли оформить как предусловие;
      - действия других ролей, нужные только для подготовки данных/состояния → описывать в предусловиях, не как шаги;
      - сценарий начинается с той роли, для которой формулируется итоговый ожидаемый результат.
    check_type: "step_check"
    params:
      operator: "not_empty"
    appliesTo:
      field: "layer"
      operator: "in"
      value: ["E2E Tests"]
