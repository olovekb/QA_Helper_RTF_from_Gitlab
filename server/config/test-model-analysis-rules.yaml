# Базовые правила анализа тестовой модели
# Проектные дополнения: config/projects/*.yaml → model_rules: "<projectId>": [ ... ]

base_model_rules:
  - id: "tm_source_of_truth"
    name: "Назначение модели и источник правды"
    description: |
      Тестовая модель фиксирует:
      * что и где покрываем;
      * как декомпозировано покрытие по C1, C2, C3, C4;
      * какую структуру хранения должен иметь набор тест-кейсов в TMS ТестОпс.

      Тестовая модель не заменяет тест-кейсы:
      * шаги, данные, ожидаемые результаты и метаданные хранятся в тест-кейсах.
      * тестовая модель задает структуру и точки покрытия
    level: "warning"
    category: "quality"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      НАЗНАЧЕНИЕ И ИСТОЧНИК ПРАВДЫ.
      Тестовая модель фиксирует: что и где покрываем; как декомпозировано покрытие по уровням C1, C2, C3, C4; какую структуру хранения
      должен иметь набор тест-кейсов в TMS ТестОпс. Модель не заменяет тест-кейсы: шаги, данные, ожидаемые результаты и метаданные хранятся в тест-кейсах;
      тестовая модель задаёт структуру и точки покрытия.
      Если смысл статьи и границы модели нарушены (в узлах модели по сути лежит содержимое тест-кейса) — warning.
      Напоминание: при расхождениях первостепенны правила статического анализа и проектные пороги/проектные правила.

  - id: "tm_structure_tms_match"
    name: "Обязательная структура тестовой модели"
    description: |
      Базовая структура для всех проектов:
      Feature → Story (C1 - E2E Tests) → Scenario (C2-C3 - Integration) → Code (C4 - Unit Tests)
    level: "error"
    category: "structure"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      СТРУКТУРА.
      Feature → Story (уровень C1, E2E Tests) → Scenario (уровни C2 и C3, Integration) → Code (уровень C4, Unit Tests), если C4 используется.

  - id: "tm_extended_structure_documented"
    name: "Проектные варианты структуры"
    description: |
      Если проект использует расширенную структуру, она фиксируется на уровне проекта и поддерживается правилами статического анализа.
      Пример (Nocode): SubBlock → Feature → Story → Scenario → Code
    level: "error"
    category: "structure"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      РАСШИРЕННАЯ СТРУКТУРА: если в дереве есть дополнительные уровни (например SubBlock над Feature, как в Nocode: SubBlock, Feature, Story, Scenario, Code),
      они должны быть осмысленны как согласованная проектная схема, а не случайное ветвление; структура должна быть согласована с проектными правилами статического анализа.
      Противоречие базовой логике C1–C4 или "сломанная" иерархия — error.

  - id: "tm_allowed_in_model"
    name: "Что фиксируется в тестовой модели"
    description: |
      * дерево и группировка покрытия;
      * список точек покрытия на уровне названий и краткого смысла;
      * принадлежность точки к уровню C1–C4;
      * связи и переиспользование, чтобы исключать дубли тест-кейсов в TMS
    level: "warning"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      ЧТО ДОЛЖНО БЫТЬ В МОДЕЛИ (не выдавай замечание если это соблюдено):
      дерево и группировка покрытия; список точек покрытия на уровне названий и краткого смысла; принадлежность точки к уровню C1, C2, C3, C4;
      Если модель вместо этого заполнена содержимым уровня тест-кейса — используй правила "что запрещено" (error).

  - id: "tm_feature_boundary"
    name: "Feature"
    description: |
      Feature — верхнеуровневая зона продукта или крупная функциональность, которую имеет смысл покрывать как единое направление.

      Граница:
      * Feature не является проверкой;
      * Feature не содержит шагов, данных и ожидаемых результатов
    level: "error"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      FEATURE. Верхнеуровневая зона продукта или крупная функциональность, единое направление покрытия.
      Граница [ERROR]: Feature не является проверкой; Feature не содержит шагов, данных и ожидаемых результатов.
      Узел, оформленный как Feature, но с пошаговым содержимым уровня ТК — error.

  - id: "tm_story_boundary"
    name: "Story (C1)"
    description: |
      Story - пользовательский сценарий уровня C1 - E2E Tests, который описывает сквозной пользовательский результат.

      Граница:
       * одна Story описывает один сквозной пользовательский смысл, без смешивания разных результатов;
       * если разные роли дают разные итоги, Story разделяется по смыслу результата
    level: "warning"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      STORY (C1, E2E Tests) — сквозной пользовательский результат.
      Граница [WARNING]: одна Story описывает один сквозной пользовательский смысл, без смешивания разных результатов.
      [WARNING]: если разные роли дают разные итоги, Story разделяются по смыслу результата.

  - id: "tm_scenario_boundary"
    name: "Scenario (C2/C3)"
    description: |
      Scenario - точка интеграционного покрытия уровня C2 C3, где проверяется изолированная логика, ветка поведения или тип ошибки.

      Граница:
      * Scenario не превращается в тест-кейс, внутри нет пошагового алгоритма;
      * если внутри одной точки фактически разные проверки, Scenario дробится на несколько
    level: "error"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      SCENARIO (C2, C3, Integration) — точка интеграционного покрытия: изолированная логика, ветка поведения или тип ошибки.
      Граница [ERROR]: Scenario не превращается в тест-кейс, внутри нет пошагового алгоритма.
      [WARNING]: если внутри одной точки фактически разные проверки, Scenario дробится на несколько.

  - id: "tm_code_boundary"
    name: "Code (C4)"
    description: |
      Code - точка покрытия для Unit Tests, если проект использует слой C4.
    level: "warning"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      CODE (C4, Unit Tests) — точка покрытия для unit-тестов, если проект реально использует слой C4.

  - id: "tm_forbidden_in_model"
    name: "Что запрещено фиксировать в модели"
    description: |
      * детальные шаги выполнения;
      * наборы параметров и перебор данных;
      * подробные ожидаемые результаты;
      * технические детали запросов/ответов на уровне полного запроса.
    level: "error"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      ЗАПРЕТ В МОДЕЛИ [ERROR]:
      детальные шаги выполнения; наборы параметров и перебор данных; подробные ожидаемые результаты;
      технические детали запросов и ответов на уровне полного запроса.
      Обнаружение такого содержимого в узлах модели — error.

  - id: "tm_tech_http_level"
    name: "Технические детали (допустимый уровень)"
    description: |
      Запрещено:
      * полный curl;
      * заголовки, токены, тело запроса целиком;
      * полный перечень всех вариантов ошибок.

      Допустимо:
      * стартовая строка как идентификатор точки без заголовков и тела;
      * метод и адрес как ориентир. Примеры: GET /payments, POST /orders/{id}/confirm.
    level: "error"
    category: "scope_boundaries"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      ТЕХНИЧЕСКИЕ ДЕТАЛИ API.
      Запрещено [ERROR]: полный curl; заголовки, токены, тело запроса целиком; полный перечень всех вариантов ошибок.
      Допустимо [WARNING]: стартовая строка как идентификатор точки взаимодействия, без заголовков и без тела; метод и адрес как ориентир, если без этого непонятно о какой интеграции речь.
      Примеры допустимого уровня: GET /payments, POST /orders/{id}/confirm.
      Нарушение запретов — error; избыточная техника , если достаточно краткой строки — warning.

  - id: "tm_naming"
    name: "Правила именования узлов"
    description: |
      * названия однозначные, без оценочных слов (корректно, нормально, удобно);
      * не использовать в названии смесь нескольких разных проверок и разных итогов;
      * если одно название требует разных итогов, узлы разделяются;
    level: "warning"
    category: "naming"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      ИМЕНОВАНИЕ [WARNING]: названия узлов однозначные, без оценочных слов (корректно, нормально, удобно).
      [WARNING]: не использовать в названии смесь нескольких разных проверок и разных итогов.
      [WARNING]: если одно название требует разных итогов, узлы разделяются.

  - id: "tm_crud"
    name: "Декомпозиция CRUD"
    description: |
      Описание по CRUD используется только там, где объект и операции над ним — ключевая часть предметной области.

      Правила:
      * в тестовой модели отражаются только операции, существующие как самостоятельные функции;
      * пакетные и массовые операции отражаются как отдельные сценарии
    level: "warning"
    category: "decomposition"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      CRUD [WARNING]: используется только там, где объект и операции над ним являются ключевой частью предметной области.
      [WARNING]: если операция не существует как самостоятельная функция, CRUD не используется как формальная дробилка.
      [WARNING]: если удаление или изменение недоступны, отражаются только реальные операции.
      [WARNING]: пакетные и массовые операции отражаются как отдельные сценарии и интеграционные точки без механического CRUD.

  - id: "tm_duplicate_across_stories"
    name: "Дубли по слоям"
    description: |
      Если одна и та же проверка повторяется в нескольких Story уровня C1, необходимо вынести ее на уровень C2-C3 и описать только один раз.
    level: "warning"
    category: "duplication"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      ДУБЛИ ПО СЛОЯМ [WARNING]: если одна и та же проверка повторяется в нескольких Story уровня C1, её нужно вынести на уровень C2/C3 и реализовать один раз.

  - id: "tm_duplicate_across_features_ok"
    name: "Дубли логики между разными фичами"
    description: |
      В тестовой модели допускается, что одинаковая логика встречается в нескольких местах дерева.
      При этом в TMS должен храниться только один тест-кейс на проверку этой логики, связанный со всеми нужными фичами через кастомные поля проекта.
    level: "warning"
    category: "duplication"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      ДУБЛИ МЕЖДУ ФИЧАМИ: в тестовой модели допускается, что одинаковая логика встречается в нескольких местах дерева.
      Не выдавай error за это; максимум напоминание [WARNING], если дублирование явно избыточно для чтения — но не путай с правилом «одна проверка в нескольких Story C1».

  - id: "tm_export_sync"
    name: "Совпадение структуры с TMS"
    description: |
      Структура в TMS должна соответствовать структуре тестовой модели.
      Изменение структуры выполняется через изменение тестовой модели и последующую синхронизацию.
      Ручное изменение структуры только в TMS/только в тестовой модели не допускаются, от этого зависит корректность подсчета test coverage и создание запусков
    level: "error"
    category: "export_sync"
    enabled: true
    is_ai_enabled: false

  - id: "tm_post_export_bloat"
    name: "Интеграционные точки после экспорта"
    description: |
      После экспорта и переноса интеграционных тест-кейсов в TMS интеграционная детализация в тестовой модели должна быть сокращена.
      Правило:
        * в тестовой модели остается структура и верхнеуровневые точки;
        * подробные интеграционные списки, которые дублируют TMS, удаляются, чтобы модель не разрасталась и оставалась читабельной
    level: "warning"
    category: "export_sync"
    enabled: true
    is_ai_enabled: false

  - id: "tm_custom_flags"
    name: "Кастомные флаги и обозначения XMind"
    description: |
      Кастомный флаг — пользовательская метка XMind для обозначения смысла, статуса или правила обработки узла.

      Правила:
      * значение каждого кастомного флага должно быть описано на странице проекта или в разделе примеров;
      * флаг не заменяет название узла или обозначение слоя;
      * если проект вводит новые флаги и обозначения, это фиксируется как проектное правило и по возможности поддерживается статическим анализом
    level: "warning"
    category: "flags"
    enabled: true
    is_ai_enabled: false

  - id: "tm_quality_readiness"
    name: "Критерии качества тестовой модели"
    description: |
      Тестовая модель считается готовой, если
      * структура соответствует принятой схеме проекта и согласована;
      * структура в TMS синхронизирована со структурой модели;
      * Story уровня C1 не дублируют одни и те же проверки, повторяемая логика вынесена на C2 C3;
      * интеграционные точки уровня C2 C3 отражают смысл проверок, но не превращены в пошаговые инструкции;
      * модель читается однозначно без знания автора, названия не содержат оценочных формулировокж
      * Story C1 не дублируют одни и те же проверки, логика на C2/C3;
      * кастомные флаги проекта описаны и используются одинаково всей командой проекта
    level: "warning"
    category: "quality"
    enabled: true
    is_ai_enabled: true
    ai_prompt: |
      КРИТЕРИИ КАЧЕСТВА. Модель считается готовой, если:
      [WARNING] Story уровня C1 не дублируют одни и те же проверки, повторяемая логика вынесена на C2/C3;
      [ERROR] интеграционные точки уровня C2/C3 отражают смысл проверок, но не превращены в пошаговые инструкции;
      [WARNING] модель читается однозначно без знания автора, названия не содержат оценочных формулировок;
      Выставляй severity по меткам [ERROR]/[WARNING] для каждого нарушенного пункта.
