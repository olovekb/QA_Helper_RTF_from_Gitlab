services:
  allure-test-inspector:
    image: git.abanking.ru:4567/vpoliakov/allure-test-inspector:main
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_PORT=3000
    ports:
      - 3000:3000
      - 5000:5000
    networks:
      - allure-test-net
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tia-mapping-service:
    depends_on:
      postgresql:
        condition: service_healthy
    image: git.abanking.ru:4567/vpoliakov/allure-test-inspector/tia-mapping-service:main
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
    ports:
      - 5001:5001
    networks:
      - allure-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgresql:
    image: postgres:16
    restart: always
    ports:
      - 5432:5432
    networks:
      - allure-test-net
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  allure-test-net:
    driver: bridge