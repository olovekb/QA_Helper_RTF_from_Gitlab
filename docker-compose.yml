services:
  allure-test-inspector:
    image: allure-test-inspector-local
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_PORT=3000
      - BERT_SCORE_SERVICE_URL=http://bert-score-service:8000
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=tia_mapping_db
      - DB_USER=${DB_USER:-tia_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DATABASE_URL=postgresql://${DB_USER:-tia_user}:${DB_PASSWORD:-password}@postgresql:5432/tia_mapping_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    ports:
      - 3000:3000
      - 5000:5000
    volumes:
      - ./report:/usr/src/app/report
    networks:
      - allure-test-net
    depends_on:
      postgresql:
        condition: service_healthy
      neo4j:
        condition: service_started
      bert-score-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tia-mapping-service:
    depends_on:
      postgresql:
        condition: service_healthy
    image: tia-mapping-service-local
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=tia_mapping_db
      - DB_USER=${DB_USER:-tia_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - 5001:5001
    networks:
      - allure-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bdd-server:
    depends_on:
      postgresql:
        condition: service_healthy
    image: bdd-server-local
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BDD_SERVER_PORT=5002
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=allure_inspector_db
      - DB_USER=${DB_USER:-tia_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - 5002:5002
    networks:
      - allure-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/bdd/steps"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bert-score-service:
    image: bert-score-service-local
    restart: always
    environment:
      - BERT_SCORE_MODEL_TYPE=bert-base-multilingual-cased
    ports:
      - 8000:8000
    networks:
      - allure-test-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgresql:
    image: pgvector/pgvector:pg16-trixie
    restart: always
    ports:
      - 5432:5432
    networks:
      - allure-test-net
    environment:
      POSTGRES_USER: ${DB_USER:-tia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-tia_mapping_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-tia_user} -d ${DB_NAME:-tia_mapping_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: neo4j:5.16-community
    restart: always
    ports:
      - 7474:7474
      - 7687:7687
    networks:
      - allure-test-net
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  allure-test-net:
    driver: bridge
